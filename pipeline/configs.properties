	SHADOW_SOFTNESS \
	shadowMapResolution \
	shadowDistance \
	DIRECTIONAL_SKYLIGHT_SHADING

screen.DEVELOPMENT=\
	DEBUG \
	SURFACE_COLORS \
	FREEZE_ANIMATION_TIMER \
	PREFER_FDM_GRADIENT \
	*

sliders=\
	shadowDistance \
	WATER_CAUSTICS_DISTANCE \
	NUM_CAUSTICS \
	PLANAR_CLOUD_LAYERS \
	DARK_UNDERWATER \
	NUM_CRESTS \
