screen=\
	STEADFAST \
	<profile> \
	[EFFECTS] \
	[WATER] \
	[ATMOSPHERE_CLOUDS] \
	[LIGHTING] \
	[DEVELOPMENT]

screen.EFFECTS=\
	GODRAYS \
	NIGHT_DESATURATION_EFFECT \
	TONEMAP \
	SATURATED_TONEMAP \
	WAVING_FOLIAGE

screen.WATER=\
	FANCY_TRANSLUCENTS \
	[WATER_WAVES] \
	SCREENSPACE_REFLECTIONS \
	SCREENSPACE_REFRACTION \
	VANILLA_ISH_WATER \
	WATER_CHARACTER \
	DARK_UNDERWATER \
	WATER_ABSORPTION_METHOD \
	WATER_CAUSTICS \
	NUM_CAUSTICS \
	WATER_CAUSTICS_DISTANCE

screen.WATER_WAVES=\
	WATER_SURFACE \
	WATER_AA \
	WATER_PARALLAX \
	WATER_PARALLAX_DISTANCE \
	NUM_CRESTS \
	NUM_RIPPLES

screen.ATMOSPHERE_CLOUDS=\
	ATMOSPHERE_MODEL \
	[LEGACY_ATMOSPHERE] \
	PLANAR_CLOUD_LAYERS \
	VANILLA_CLOUDS \
	BORDER_FOG \
