#define FANTASY 0
#define SEMI_NATURAL 1
#define RETRO 2

### CUSTOM UNIFORMS: Sky lighting

#if DAY_SKY_LIGHTING == SEMI_NATURAL
	# This sunProgress curve rapidly rises to 1.0 resulting in fairly short yet
	# fairly intense sunrises that quickly transition into broad daylight.
	#
	# The division by 0.75 is to account for the 40 degree sun angle meaning that
	# worldSunVector.y never actually gets to 1.0.
	uniform.float.sunProgress=1.0 - pow(1.0 - clamp(worldSunVector.y / 0.75, 0.0, 1.0), 2)

	variable.vec3.sunlightBase = vec3( \
		4.0 * (0.40 + 0.60 * sunProgress), \
		4.0 * (0.08 + 0.04 * sunProgress + 0.88 * sunProgress * sunProgress), \
		4.0 * (0.00 + 0.95 * pow(0.1 + 0.9 * sunProgress, 3.0)))

	variable.float.sunlightLumaRain=0.05
	variable.float.sunlightBounce=mix(0.05, 0.10, sunProgress)

	# Similarly to how sunlight suppresses block light, make sunlight also suppress up to
	# 80% of the ambient light, peaking at noon.
	#
	# This is because our light colors are tuned for an environment with no autoexposure
	# and are not physically-based. As a result, while in real life sunlight is a lot
	# brighter than the ambient lighting, in Steadfast ambient light and sunlight actually
	# have comparable intensities. To avoid making sunlight appear to have a blue tint,
	# as a result, we must suppress ambient lighting when sunlight is shining.
	#
	# NOTE: Since this works by subtracting ambient light from sunlight, be careful that
	#       this does not go negative. Also note that water caustics can cause direct light
	#       to be up to 2.5x its normal value!
	variable.float.sunlightSuppressesAmbient=0.8 * sunProgress * (1.0 - rainStrength)

	# TODO: Very blue ambient option:
	# variable.float.sunlightBounce=mix(0.025, 0.05, sunProgress)
#elif DAY_SKY_LIGHTING == FANTASY
	# Calculate sun progression based on the sine of the angle of the sun with the horizon
	# When the sun is at the horizon, the progress is 0.0, when it is at the top, the progress
	# is 1.0.
	#
	# Of course, with a 40 degree sun path rotation, it never actually reaches the top. But 
	# that is OK for us.
	variable.float.sunProgress=pow(clamp(worldSunVector.y, 0.0, 1.0), 2)

	variable.float.riseB=1.75 * sunProgress * sunProgress
	variable.float.maxB=0.32 + 0.05 * sunProgress
	variable.float.greenV=if(sunProgress > 0.5, 0.375, (-1.5 * sunProgress * sunProgress) + (1.5 * sunProgress))

	# Red:   Constant
	# Green: Simple quadratic but cap out at 0.5
	# Blue:  Rapid rise with a slowly-rising ceiling
	variable.vec3.sunlightBase=vec3( \
		8.0 * 0.6, \
		8.0 * (0.125 + greenV), \
		8.0 * (0.005 + min(riseB, maxB)) \
	)

	variable.float.sunlightLumaRain=0.08
	variable.float.sunlightBounce=0.125
	variable.float.sunlightSuppressesAmbient=0.0
#else
	# The division by 0.75 is to account for the 40 degree sun angle meaning that
	# worldSunVector.y never actually gets to 1.0.
	variable.float.sunProgress=clamp(worldSunVector.y / 0.75, 0.0, 1.0)

	variable.vec3.sunlightBase=vec3( \
		3.3 * mix(0.75, 1.00, sunProgress), \
		3.3 * mix(0.55, 0.88, sunProgress), \
		3.3 * mix(0.10, 0.75, sunProgress))

	variable.float.sunlightLumaRain=0.0
	variable.float.sunlightBounce=0.1
	variable.float.sunlightSuppressesAmbient=0.0
#endif

# Rec601 luma from https://en.wikipedia.org/wiki/Luma_(video)
variable.float.sunlightLuma=0.299 * sunlightBase.r + 0.587 * sunlightBase.g + 0.114 * sunlightBase.b

uniform.vec3.sunlightColor=vec3( \
	mix(sunlightBase.r, sunlightLuma * sunlightLumaRain, rainStrength), \
	mix(sunlightBase.g, sunlightLuma * sunlightLumaRain, rainStrength), \
	mix(sunlightBase.b, sunlightLuma * sunlightLumaRain, rainStrength))

#if NIGHT_SKY_LIGHTING == SEMI_NATURAL
	variable.vec3.moonlightBase=vec3( \
		0.16 * 0.5, \
		0.16 * 0.5, \
		0.16 * 1.0 \
	)

	variable.float.moonlightLumaRain=0.25
#elif NIGHT_SKY_LIGHTING == FANTASY
	variable.vec3.moonlightBase=vec3( \
		0.16 * 0.35, \
		0.16 * 0.65, \
		0.16 * 1.00 \
	)

	variable.float.moonlightLumaRain=0.5
#else
	variable.vec3.moonlightBase=vec3( \
		0.33 * 0.35, \
		0.33 * 0.65, \
		0.33 * 1.00 \
	)

	variable.float.moonlightLumaRain=0.0
#endif

# Rec601 luma from https://en.wikipedia.org/wiki/Luma_(video)
variable.float.moonlightLuma=0.299 * moonlightBase.r + 0.587 * moonlightBase.g + 0.114 * moonlightBase.b
uniform.vec3.moonlightColor=vec3( \
	mix(moonlightBase.r, moonlightLuma * moonlightLumaRain, rainStrength), \
	mix(moonlightBase.g, moonlightLuma * moonlightLumaRain, rainStrength), \
	mix(moonlightBase.b, moonlightLuma * moonlightLumaRain, rainStrength))

# To avoid a sudden jolt between the sun casting shadows and the moon casting shadows,
# we have a very brief (only a few seconds) fade to no diffuse lighting when switching
# the shadow light source.
#
# This value is 1.0 most of the time, but very rapidly falls to 0.0 and rises back to 1.0
# as the sun/moon approach the horizon.
variable.float.lightTransitionFade=pow(min(1.0, 66.0 * abs(worldSunVector.y)), 2.0)

#ifdef MINISHITA_LIGHTING
	uniform.vec3.directLightSurface=directLightSurfaceMinishita
#else
	# Pick the right light source depending on whether the sun or moon is currently casting
	# shadows, and fade to dark during the transition between the sun and moon.
	#
	# This is equivalent to: if(worldSunVector.y > 0.0, sunlightColor, moonlightColor) * lightTransitionFade
	#
	# This variant is the direct light color applied to the world surface above-water.
	uniform.vec3.directLightSurface=vec3( \
		if(worldSunVector.y > 0.0, sunlightColor.r * (1.0 - sunlightBounce) - sunlightSuppressesAmbient * ambientDaySkyColor.r, moonlightColor.r) * lightTransitionFade, \
		if(worldSunVector.y > 0.0, sunlightColor.g * (1.0 - sunlightBounce) - sunlightSuppressesAmbient * ambientDaySkyColor.g, moonlightColor.g) * lightTransitionFade, \
		if(worldSunVector.y > 0.0, sunlightColor.b * (1.0 - sunlightBounce) - sunlightSuppressesAmbient * ambientDaySkyColor.b, moonlightColor.b) * lightTransitionFade \
	)
#endif

# Rec601 luma from https://en.wikipedia.org/wiki/Luma_(video)
variable.float.directLightLuma=0.299 * directLightSurface.r + 0.587 * directLightSurface.g + 0.114 * directLightSurface.b

# The underwater direct light color is faded slightly with the luma to lighten up some of the
# yellows during sunrise to avoid a weird green tint with water absorption.
uniform.vec3.directLightUnderwater=vec3( \
	mix(directLightSurface.r, directLightLuma, 0.5), \
	mix(directLightSurface.g, directLightLuma, 0.5), \
	mix(directLightSurface.b, directLightLuma, 0.5) \
)

uniform.float.causticsFade=1.0 - rainStrength

### CUSTOM UNIFORMS: Sky gradient
uniform.float.skyVisibilityDay=pow(clamp(0.90 + worldSunVector.y / 0.15, 0.0, 1.0), 4.0)

#if DAY_ATMOSPHERE == SEMI_NATURAL
	uniform.float.sunrise=if(isEyeInWater == 1, 0.0, 0.5 * pow(clamp(1.0 - 45.0 * pow(abs(worldSunVector.y), 6.0), 0.0, 1.0), 2))
#elif DAY_ATMOSPHERE == FANTASY
	uniform.float.sunrise=if(isEyeInWater == 1, 0.0, pow(clamp(1.0 - 15.0 * pow(abs(worldSunVector.y), 6.0), 0.0, 1.0), 2))
	# TODO: Non-yellow sunrises option - keep or remove? It was part of YELLOWER_SUNRISES
	#uniform.float.sunrise=if(isEyeInWater == 1, 0.0, pow(clamp(1.0 - 15.0 * pow(abs(worldSunVector.y), 4.0), 0.0, 1.0), 2))
#else
	uniform.float.sunrise=0.0
#endif

variable.vec3.skyColorDay=vec3(0.05, 0.32, 1.0)

#if DAY_ATMOSPHERE == SEMI_NATURAL
	variable.vec3.skyZenithDayLand=vec3( \
		skyVisibilityDay * mix(mix(0.05, 0.15, sunProgress), 0.5, rainStrength), \
		skyVisibilityDay * mix(mix(0.06, 0.30, sunProgress), 0.5, rainStrength), \
		skyVisibilityDay * mix(mix(0.10, 1.00, sunProgress), 0.6, rainStrength)  \
	)

	variable.vec3.skyHorizonDayLand=vec3( \
		skyVisibilityDay * mix(mix(1.00, 0.75 * 1.5, pow(sunProgress, 1.0)), 0.5, rainStrength), \
		skyVisibilityDay * mix(mix(0.33, 0.75 * 2.5, pow(sunProgress, 1.2)), 0.5, rainStrength), \
		skyVisibilityDay * mix(mix(0.11, 0.75 * 5.0, pow(sunProgress, 1.6)), 0.6, rainStrength)  \
	)
#else
	# Note: The 0.6 in the clamp doesn't actually do anything, it's for symmetry
	#	   with below. it's the measured max value.
	variable.float.horizonSunlightMix = 0.64 * (1.0 - 0.5 * clamp(worldSunVector.y - 0.2, 0.0, 0.6))

	# TODO: Keep or get rid of this? it was part of YELLOWER_SUNRISES
	# Note: This makes the horizon mix way less at sunrise which is consistent with the
	#	   less yellowness at sunrise, otherwise we have a very pink horizon.
	# variable.float.horizonSunlightMix = 0.64 * (1.0 - 0.5 * clamp(worldSunVector.y + 0.3, 0.0, 0.6))

	variable.vec3.skyZenithDayLand=vec3( \
		skyVisibilityDay * (1.0 + worldSunVector.y) * mix(0.75 * skyColorDay.r, 0.8, rainStrength), \
		skyVisibilityDay * (1.0 + worldSunVector.y) * mix(0.75 * skyColorDay.g, 0.8, rainStrength), \
		skyVisibilityDay * (1.0 + worldSunVector.y) * mix(0.75 * skyColorDay.b, 0.8, rainStrength) \
	)

	variable.vec3.skyHorizonDayLand=vec3( \
		mix(mix(5.0 * skyColorDay.r, (5.0 / 7.5) * sunlightColor.r, horizonSunlightMix), 2.5, rainStrength), \
		mix(mix(5.0 * skyColorDay.g, (5.0 / 7.5) * sunlightColor.g, horizonSunlightMix), 2.5, rainStrength), \
		mix(mix(5.0 * skyColorDay.b, (5.0 / 7.5) * sunlightColor.b, horizonSunlightMix), 2.5, rainStrength) \
	)
#endif

variable.vec3.skyHorizonDayUnderwater=vec3( \
	0.03 * 2.0, \
	0.25 * 2.0, \
	1.00 * 2.0 \
)

#if DAY_ATMOSPHERE == SEMI_NATURAL || DAY_ATMOSPHERE == FANTASY
	uniform.vec3.skyZenithDay=vec3( \
		skyVisibilityDay * if(isEyeInWater == 1, 2.0 * skyHorizonDayUnderwater.r, skyZenithDayLand.r), \
		skyVisibilityDay * if(isEyeInWater == 1, 2.0 * skyHorizonDayUnderwater.g, skyZenithDayLand.g), \
		skyVisibilityDay * if(isEyeInWater == 1, 2.0 * skyHorizonDayUnderwater.b, skyZenithDayLand.b) \
	)
#else
	# Convert sky color to linear RGB and brighten it appropriately for HDR rendering
	uniform.vec3.skyZenithDay=vec3( \
		pow(skyColor.r, 2.2) * 2.0, \
		pow(skyColor.g, 2.2) * 2.0, \
		pow(skyColor.b, 2.2) * 2.0 \
	)
#endif

uniform.vec3.skyHorizonDay=vec3( \
	skyVisibilityDay * if(isEyeInWater == 1, skyHorizonDayUnderwater.r, skyHorizonDayLand.r), \
	skyVisibilityDay * if(isEyeInWater == 1, skyHorizonDayUnderwater.g, skyHorizonDayLand.g), \
	skyVisibilityDay * if(isEyeInWater == 1, skyHorizonDayUnderwater.b, skyHorizonDayLand.b) \
)

#if NIGHT_ATMOSPHERE == SEMI_NATURAL
	# Fade out sunglow earlier since there's not much night sky to balance it out, and if
	# we let it be too strong it looks ugly!
	uniform.vec3.skyLightDay=vec3( \
		(1.0 - skyVisibilityNight) * skyVisibilityDay * 2.0 * sunlightColor.r, \
		(1.0 - skyVisibilityNight) * skyVisibilityDay * 2.0 * sunlightColor.g, \
		(1.0 - skyVisibilityNight) * skyVisibilityDay * 2.0 * sunlightColor.b \
	)
#else
	uniform.vec3.skyLightDay=vec3( \
		skyVisibilityDay * 2.0 * sunlightColor.r, \
		skyVisibilityDay * 2.0 * sunlightColor.g, \
		skyVisibilityDay * 2.0 * sunlightColor.b \
	)
#endif

variable.float.skyVisibilityNight=pow(clamp(0.90 - worldSunVector.y / 0.15, 0.0, 1.0), 4.0)

#if NIGHT_ATMOSPHERE == SEMI_NATURAL
	uniform.float.moonrise=0.0

	uniform.vec3.skyZenithNight=vec3(0.0008 * 4.0 * 0.33, 0.0008 * 4.0 * 0.5, 0.0008 * 4.0 * 1.0)
	uniform.vec3.skyHorizonNight=vec3(\
		(0.003 + 0.03 * nightVision) * 2.0 * 0.33, \
		(0.003 + 0.03 * nightVision) * 2.0 * 0.5, \
		(0.003 + 0.03 * nightVision) * 2.0 * 1.0)
#elif NIGHT_ATMOSPHERE == FANTASY
	uniform.float.moonrise=pow(clamp(1.0 - 15.0 * pow(abs(-worldSunVector.y), 6.0), 0.0, 1.0), 2)

	uniform.vec3.skyZenithNight=vec3( \
		skyVisibilityNight * mix(0.1 * 0.07, 0.1 * 0.50, 0.75 * rainStrength), \
		skyVisibilityNight * mix(0.1 * 0.45, 0.1 * 0.50, 0.75 * rainStrength), \
		skyVisibilityNight * mix(0.1 * 1.00, 0.1 * 0.50, 0.75 * rainStrength) \
	)

	uniform.vec3.skyHorizonNight=vec3( \
		skyVisibilityNight * (1.0 + nightVision) * mix(0.250, 0.5 * 0.66, 0.75 * rainStrength), \
		skyVisibilityNight * (1.0 + nightVision) * mix(0.575, 0.5 * 0.66, 0.75 * rainStrength), \
		skyVisibilityNight * (1.0 + nightVision) * mix(1.000, 0.5 * 0.66, 0.75 * rainStrength) \
	)
#else
	uniform.float.moonrise=0.0
	uniform.vec3.skyZenithNight=vec3(0.0, 0.0, 0.0)
	uniform.vec3.skyHorizonNight=vec3( \
		(0.005 + 0.015 * nightVision) * 1.0 * (1.0 - 0.75 * rainStrength), \
		(0.005 + 0.015 * nightVision) * 1.0 * (1.0 - 0.75 * rainStrength), \
		(0.005 + 0.015 * nightVision) * 3.0 * (1.0 - 0.75 * rainStrength))
#endif

#if NIGHT_ATMOSPHERE == SEMI_NATURAL
	uniform.vec3.skyLightNight=vec3(0.0, 0.0, 0.0)
#else
	uniform.vec3.skyLightNight=vec3( \
		skyVisibilityNight * 5.0 * moonlightColor.r, \
		skyVisibilityNight * 5.0 * moonlightColor.g, \
		skyVisibilityNight * 5.0 * moonlightColor.b \
	)
#endif

### CUSTOM UNIFORMS: Cloud direct/ambient lighting

# For now, just reuse skyAmbient. This could be tweaked if needed though.
#if NIGHT_ATMOSPHERE == SEMI_NATURAL
	uniform.vec3.cloudLightAmbient=skyZenithNight
#else
	uniform.vec3.cloudLightAmbient=skyAmbient
#endif

# This is around the same as directLightSurface, but 2.5x brighter during the day
# and 7.5x brighter at night, in addition to having a smoother transition between
# day and night, rather than fading all the way to dark.
#
# TODO: Support RETRO lighting style for clouds
variable.float.nightAmbientFadeClouds=pow(clamp(0.90 - worldSunVector.y / 0.1, 0.0, 1.0), 4)
#if NIGHT_ATMOSPHERE == SEMI_NATURAL
	variable.vec3.cloudLightDirectNight=vec3( \
		0.08 * 0.20, \
		0.08 * 0.35, \
		0.08 * 1.00)
#else
	variable.vec3.cloudLightDirectNight=vec3( \
		4.0 * moonlightBase.r, \
		4.0 * moonlightBase.g, \
		4.0 * moonlightBase.b)
#endif
uniform.vec3.cloudLightDirect=vec3( \
	2.5 * (dayAmbientFade * mix(sunlightBase.r, sunlightLuma * 0.2, rainStrength) \
	       + nightAmbientFadeClouds * mix(cloudLightDirectNight.r, skyZenithNight.r, rainStrength)), \
	2.5 * (dayAmbientFade * mix(sunlightBase.g, sunlightLuma * 0.2, rainStrength) \
	       + nightAmbientFadeClouds * mix(cloudLightDirectNight.g, skyZenithNight.g, rainStrength)), \
	2.5 * (dayAmbientFade * mix(sunlightBase.b, sunlightLuma * 0.2, rainStrength) \
	       + nightAmbientFadeClouds * mix(cloudLightDirectNight.b, skyZenithNight.b, rainStrength)) \
)
uniform.vec3.cloudColor=cloudLightAmbient + \
	vec3(cloudLightDirect.r * 0.5, cloudLightDirect.g * 0.5, cloudLightDirect.b * 0.5)

variable.float.cloudDensityEdge0=0.3125 - rainStrength * 0.25
variable.float.cloudDensityEdge1=1.0    - rainStrength * 0.25
uniform.float.cloudDensityScale=0.7 / (cloudDensityEdge1 - cloudDensityEdge0)
uniform.float.cloudDensityThreshold=-cloudDensityEdge0 / (cloudDensityEdge1 - cloudDensityEdge0)
uniform.float.cloudFade=if(isEyeInWater == 1, 0.0, 0.25 + 0.25 * sunrise)

### CUSTOM UNIFORMS: World ambient / diffuse lighting

# During the day, suppress block light based on the ambient sky lighting. In other words,
# terrain completely exposed to the sky will essentially entirely suppress all block lighting.
#
# In real life, sunlight is significantly brighter than any other light source, and the
# eye adapts to this accordingly, such that other light sources have very little impact
# due to their low relative impact.
#
# Many shader packs simulate this in a literal sense by adding autoexposure and eye adaption effects.
# Even vanilla Minecraft simulates this in its lightmap by maxing out lighting and not adding
# in additional contribution from block light at 100% sky light.
#
# However, we have committed to not using eye adaption / autoexposure effects because they tend
# to be pretty obnoxious, and actually flat out wrong compared to how our quickly our eyes adapt
# to exposure differences. In addition, HDR means that Minecraft's method exploiting LDR color
# maxing out is not directly applicable.
#
# This mechanism is a very convincing way of making sunlight look far brighter than block lighting,
# without needing eye adaption effects and similar. By fading out blocklight in areas exposed to
# the sky during the day, we accomplish this same effect without all of the nasty side effects of
# the autoexposure / eye adaption approach.
#
# We fade in torches/etc slowly before it turns night rather than rapidly fading them in after
# it has already turned night, so that by the time the sun sets, all blocklight has completed
# fading in.
#
# Note: nightBlocklightFade is similar to nightAmbientFade but starts sooner and is more gradual.
variable.float.nightBlocklightFade=pow(clamp(1.0 - worldSunVector.y / 0.25, 0.0, 1.0), 4.0)
uniform.float.blocklightSuppression=(1.0 - nightBlocklightFade) * (1.0 - pow(rainStrength, 4.0))

uniform.float.heldLightBaseStrength=pow(heldBlockLightValue / 15.0, 4)
uniform.float.heldLightSuppression=smooth(eyeBrightness.y / 240.0, 0.4, 0.4)

# Smoothly transition between daytime and nighttime ambient lighting.
#
# This results in a rapid but smooth rampup from 0% to 100% as the sun/moon
# crosses the horizon and becomes the dominant source of light.
#
# A divisor of 0.05 with a 0.90 basis means that the transition occurs in +/-
# 0.3 degrees from the horizon.
#
# Note that worldMoonVector.y is -worldSunVector.y
uniform.float.dayAmbientFade=pow(clamp(0.90 + worldSunVector.y / 0.05, 0.0, 1.0), 4)
variable.float.nightAmbientFade=pow(clamp(0.90 - worldSunVector.y / 0.05, 0.0, 1.0), 4)

# Approximation of the light that the sky casts on to the world.
# This should be close to the actual color of the sky to look natural.
#
#if DAY_SKY_LIGHTING == SEMI_NATURAL
	variable.vec3.ambientDaySkyColor=vec3( \
		0.66 * mix(mix(0.08, 0.15, sunProgress), 0.5, rainStrength), \
		0.66 * mix(mix(0.09, 0.30, sunProgress), 0.5, rainStrength), \
		0.66 * mix(mix(0.21, 1.00, sunProgress), 0.6, rainStrength)  \
	)
#elif DAY_SKY_LIGHTING == FANTASY
	uniform.vec3.ambientDaySkyColor=vec3( \
		0.33 * (      0.20 * rainStrength), \
		0.33 * (0.5 - 0.25 * rainStrength), \
		0.33 * (1.0 - 0.75 * rainStrength) \
	)
#else
	uniform.vec3.ambientDaySkyColor=vec3( \
		0.75, \
		0.75, \
		0.75 + 0.1 * sunProgress \
	)
#endif

# Mix the ambient day sky color approximation with a little bit of sunlight.
#
# dayAmbientFade * (ambientDaySkyColor + sunlightBounce * sunlightColor);
variable.vec3.daySkyAmbient=vec3( \
	dayAmbientFade * (ambientDaySkyColor.r + sunlightBounce * sunlightColor.r), \
	dayAmbientFade * (ambientDaySkyColor.g + sunlightBounce * sunlightColor.g), \
	dayAmbientFade * (ambientDaySkyColor.b + sunlightBounce * sunlightColor.b)  \
)

# Moonlight is close enough to the moon sky color
# that we don't consider the night sky separate from moonlight.
# 
# 0.2 * nightAmbientFade * moonlightColor;
#if DAY_SKY_LIGHTING == SEMI_NATURAL
	variable.vec3.nightSkyAmbient=vec3( \
		nightAmbientFade * (mix(0.25 * 0.06, 0.05, rainStrength) * 0.8 + (0.3/0.6) * moonlightColor.r), \
		nightAmbientFade * (mix(0.5  * 0.06, 0.05, rainStrength) * 0.8 + (0.3/0.6) * moonlightColor.g), \
		nightAmbientFade * (mix(1.0  * 0.06, 0.06, rainStrength) * 0.8 + (0.3/0.6) * moonlightColor.b)  \
	)
#elif DAY_SKY_LIGHTING == FANTASY
	variable.vec3.nightSkyAmbient=moonlightColor * vec3(0.2 * nightAmbientFade, 0.2 * nightAmbientFade, 0.2 * nightAmbientFade)
#else
	variable.vec3.nightSkyAmbient=vec3( \
		0.175 * (1.0 - 0.5 * rainStrength), \
		0.20  * (1.0 - 0.5 * rainStrength), \
		0.4   * (1.0 - 0.5 * rainStrength)  \
	) * vec3(nightAmbientFade, nightAmbientFade, nightAmbientFade)
#endif

# Blue-ish base ambient color to give a chilling, cold atmosphere in unlit caves and indoor spaces.
# Night vision raises the base ambient color in all spaces.
#ifdef MINISHITA_LIGHTING
	uniform.vec3.skyAmbient=skyAmbientMinishita
	uniform.vec3.minAmbient=minAmbientMinishita
#else
	uniform.vec3.skyAmbient=daySkyAmbient + nightSkyAmbient
	uniform.vec3.minAmbient=vec3(\
		0.02 * 0.33 + nightVision * (0.5 + 4.0 * nightSkyAmbient.r), \
		0.02 * 0.8  + nightVision * (0.5 + 4.0 * nightSkyAmbient.g), \
		0.02 * 1.0  + nightVision * (0.5 + 4.0 * nightSkyAmbient.b))
#endif

### CUSTOM UNIFORMS: Nighttime color desaturation
uniform.float.desaturationIntensity=0.66 * (1.0 - dayAmbientFade) * (1.0 - 0.6 * nightVision)
uniform.vec3.desaturationColor=vec3(0.33, 0.5, 1.0)

### CUSTOM UNIFORMS: General composite shader uniforms

# A multiplier to convert from window space (measured in pixels / texels)
# to screen space (0.0 to 1.0).
uniform.vec2.windowToScreen=vec2(1.0 / viewWidth, 1.0 / viewHeight)

# The same, but to NDC space.
uniform.vec2.windowToNdc=vec2(2.0 / viewWidth, 2.0 / viewHeight)

### CUSTOM UNIFORMS: Godrays (Screen-Space Light Shafts)

# Same as windowToScreen, but accounting for the godrays rendering scale.
uniform.vec2.windowToScreenGodrays=vec2(1.0 / (0.5 * viewWidth), 1.0 / (0.5 * viewHeight))

# In view space, the forward direction is ALWAYS towards negative Z, that is,
# (0.0, 0.0, -1.0). We want the dot product of the view-space shadow light
# vector with this forward vector, but that ends up just being the following:
variable.float.LdotF=-lightVector.z

# Fade out godrays gradually as you look away from the light. At 60 degrees,
# godrays are no longer visible. This is required to avoid flickering and flashing
# artifacts at high view angles, as well as godrays coming from the exact opposite
# direction as the light.
variable.float.godraysMaxAngle=cos(degrees(60.0))
variable.float.godraysViewAngleFade=pow(max(0.0, (LdotF - godraysMaxAngle) / (1.0 - godraysMaxAngle)), 2.0)

# Even if we are looking within 60 degrees of the sun, the shadow light position can go off-screen if
# we look through a spyglass or otherwise zoom in. This is an additional protection against
# that, explicitly fading away godrays when the shadow-casting light is off-screen.
variable.float.godraysOffscreenFade=if(clipLightVector.w > 0.0, \
	min( \
		(1.0 - max(abs(ndcLightVector.x), abs(ndcLightVector.y))) / 0.1, \
		1.0 \
	), \
	0.0)

# At night, tune the godrays based on moonlight brightness and sky brightness.
# Without this tuning, for very dark skies, the godrays will be too bright, but
# for very bright skies, they will be too dark.

#if NIGHT_ATMOSPHERE == FANTASY
	variable.float.godraysNightExposure=0.64
#elif NIGHT_SKY_LIGHTING == RETRO
	variable.float.godraysNightExposure=0.04
#else
	variable.float.godraysNightExposure=0.16
#endif

# Weaken godrays during the day because they get a bit too obtrusive
# with bright white sunlight.

#if DAY_SKY_LIGHTING == RETRO
	variable.float.godraysDayExposureMorning=0.40
	variable.float.godraysDayExposureNoon=0.20
#elif DAY_SKY_LIGHTING == FANTASY
	variable.float.godraysDayExposureMorning=0.24
	variable.float.godraysDayExposureNoon=0.08
#else
	variable.float.godraysDayExposureMorning=0.16
	variable.float.godraysDayExposureNoon=0.08
#endif

# Tune godrays exposure based on time of day and the lighting colors / sky colors
# to try to make sure they are balanced relative to the background.
variable.float.godraysBaseExposure=if(\
	worldSunVector.y > 0.0, \
	mix(godraysDayExposureMorning, godraysDayExposureNoon, sunProgress), \
	godraysNightExposure)

# The final godrays exposure is the product of the view-angle fade and the time-of-day
# exposure value.
uniform.float.godraysExposure=godraysBaseExposure * godraysViewAngleFade * godraysOffscreenFade

# Godrays are the color of the direct light. Pre-multiply in the exposure value so
# the shader can skip a multiply for free.
uniform.vec3.godraysColor=vec3( \
	directLightSurface.r * godraysExposure, \
	directLightSurface.g * godraysExposure, \
	directLightSurface.b * godraysExposure)
